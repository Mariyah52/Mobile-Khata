# Runs the Firestore security-rules tests against the real Firebase emulator
# on every push and pull request. Failing here means a rules change broke
# tenant isolation, roles, numbering counters or payment submissions.
name: Firestore rules test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test tools
        run: npm ci
      - name: Run rules tests in the emulator
        run: npx firebase emulators:exec --only firestore --project demo-mobile-khata "npm run test:rules"
